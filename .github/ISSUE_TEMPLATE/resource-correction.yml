name: Resource correction
description: Report a factual, clarity, accessibility, or broken-link problem.
title: "[Correction]: "
labels:
  - correction
body:
  - type: markdown
    attributes:
      value: "Do not include private data, credentials, customer information, or confidential screenshots."
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Factual accuracy
        - Clarity for beginners
        - Broken link
        - Accessibility
        - Fictional example
        - Other
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or section
      placeholder: service-playbooks/01-lead-follow-up-assistant.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Link a current primary source when the change depends on a factual claim.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, credentials, customer information, and private screenshots.
          required: true
